<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container py-4">
        <div class="mb-3">
            <div class="text-center bg-danger p-3 text-white rounded">Welcome to Our Store</div>
        </div>

        <div class="row g-3" id="cartContainer">
            <div class="col-12">
                <select id="mealType" class="form-select mb-3" aria-label="Select meal type">
                    <option value="Dessert" selected>Dessert</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Beef">Beef</option>
                    <option value="Chicken">Chicken</option>
                    <option value="Seafood">Seafood</option>
                    <option value="Vegetarian">Vegetarian</option>
                    <option value="Goat">Goat</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Side">Side</option>
                    <option value="Starter">Starter</option>
                    <option value="Vegan">Vegan</option>
                </select>
            </div>
            <div class="col-12">
                <button type="button" class="btn btn-outline-primary" onclick="showSelectedFood()">Show food</button>
            </div>
        </div>

        <div class="row g-4 mt-3" id="foodList"></div>
    </div>

    <script>
        function renderFoodList(items) {
            const foodList = document.getElementById('foodList');

            if (!items || !items.length) {
                foodList.innerHTML = '<div class="col-12"><div class="alert alert-warning">No food available for this category.</div></div>';
                return;
            }

            foodList.innerHTML = items.map(item => `
                <div class="col-md-4">
                    <div class="card h-100">
                        <img src="${item.strMealThumb}" class="card-img-top" alt="${item.strMeal}" style="height: 220px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title">${item.strMeal}</h5>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showSelectedFood() {
            const selectedCategory = document.getElementById('mealType').value;

            fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${selectedCategory}`)
                .then(res => res.json())
                .then(data => {
                    const meals = data.meals || [];
                    renderFoodList(meals);
                })
                .catch(error => {
                    document.getElementById('foodList').innerHTML = '<div class="col-12"><div class="alert alert-danger">Failed to load food items from the API.</div></div>';
                    console.error(error);
                });
        }

        showSelectedFood();
    </script>
</body>
</html>
